   catch(e){toast('Export failed: '+e.message);console.error(e);try{output&&await output.cancel()}catch{}}
   finally{exporting=false;$('#ov').style.display='none';for(const k of Object.keys(gens))try{gens[k].return()}catch{};for(const k of Object.keys(R))disposeR(k)}}
